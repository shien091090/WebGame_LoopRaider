<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>banner-d 白晝重演地圖</title>
<style>body{margin:0;overflow:hidden;background:#cfeedd}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1680" height="720"></canvas>
<script src="../game/art/art.js"></script>
<script src="banner-common.js"></script>
<script>
// 橫幅 D: 明亮的大地圖俯瞰。四塊關卡地景沿一條環狀路排列, 每塊都在重演一段通關;
// 小隊沿環路不停繞圈, 每塊地景冒出的素材順著支線流進環中央的營地, 堆成一座發光的小山
(function () {
  var B = BN.make(), ctx = B.ctx, A = B.A, TAU = B.TAU, i, j;
  // ---- 地圖紙: 明亮草原 + 淡格線 + 樹叢 / 小丘 ----
  ctx.fillStyle = B.vgrad(0, 720, [0, '#d9f4e4', 1, '#b6e6c6']); ctx.fillRect(0, 0, 1680, 720);
  ctx.strokeStyle = 'rgba(90,150,120,0.12)'; ctx.lineWidth = 1;
  ctx.beginPath(); for (i = 0; i <= 1680; i += 48) { ctx.moveTo(i + 0.5, 0); ctx.lineTo(i + 0.5, 720); } for (i = 0; i <= 720; i += 48) { ctx.moveTo(0, i + 0.5); ctx.lineTo(1680, i + 0.5); } ctx.stroke();
  // 河(右上 → 右下, 淺藍)
  ctx.beginPath(); ctx.moveTo(1560, -10);
  for (i = 0; i <= 74; i++) { var ry = i * 10; ctx.lineTo(1560 + Math.sin(ry / 90) * 30 + ry * 0.06, ry); }
  ctx.lineWidth = 46; ctx.strokeStyle = '#8fd0ea'; ctx.stroke(); ctx.lineWidth = 30; ctx.strokeStyle = '#b8e4f4'; ctx.stroke();
  // 樹叢與小丘(散布在地圖四周)
  function tree(x, y, s) {
    ctx.fillStyle = 'rgba(60,110,70,0.18)'; ctx.beginPath(); ctx.ellipse(x + 4, y + s * 0.9, s * 0.9, s * 0.3, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#7a5a36'; ctx.fillRect(x - s * 0.12, y, s * 0.24, s * 0.8);
    ctx.fillStyle = '#5fb565'; ctx.beginPath(); ctx.arc(x, y, s * 0.7, 0, TAU); ctx.fill();
    ctx.fillStyle = '#86d17d'; ctx.beginPath(); ctx.arc(x - s * 0.2, y - s * 0.22, s * 0.38, 0, TAU); ctx.fill();
  }
  for (i = 0; i < 46; i++) {
    var tx = B.hash(i, 1) * 1680, ty = B.hash(i, 2) * 720;
    var ex = (tx - 1010) / 520, ey = (ty - 385) / 300;
    if (ex * ex + ey * ey < 1) continue;
    tree(tx, ty, 14 + B.hash(i, 3) * 12);
  }
  ctx.fillStyle = 'rgba(150,200,140,0.5)';
  [[260, 380, 120, 50], [180, 470, 90, 34], [1600, 640, 100, 40]].forEach(function (h) { ctx.beginPath(); ctx.ellipse(h[0], h[1], h[2], h[3], 0, Math.PI, TAU); ctx.fill(); });

  // ---- 環狀路 ----
  var CX = 1010, CY = 385, RX = 450, RY = 228;
  function ringPt(a) { return [CX + Math.cos(a) * RX, CY + Math.sin(a) * RY]; }
  ctx.beginPath(); ctx.ellipse(CX, CY, RX, RY, 0, 0, TAU);
  ctx.lineWidth = 50; ctx.strokeStyle = '#c9a670'; ctx.stroke();
  ctx.lineWidth = 42; ctx.strokeStyle = '#f0dcaa'; ctx.stroke();
  ctx.save(); ctx.setLineDash([16, 18]); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(170,120,60,0.6)'; ctx.stroke(); ctx.restore();
  // 方向箭頭(順時針)
  for (i = 0; i < 12; i++) {
    var a = i * TAU / 12 + 0.26, p = ringPt(a), tang = Math.atan2(Math.cos(a) * RY, -Math.sin(a) * RX);
    ctx.save(); ctx.translate(p[0], p[1]); ctx.rotate(tang);
    ctx.beginPath(); ctx.moveTo(-6, -9); ctx.lineTo(5, 0); ctx.lineTo(-6, 9); ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(232,160,60,0.85)'; ctx.stroke();
    ctx.restore();
  }

  // ---- 中央營地: 素材小山 + 支線 ----
  var HX = CX, HB = 470;
  // 四條支線(關卡 → 營地)
  var PLOTS = [
    { a: Math.PI, theme: 'forest', cls: 'sword', pose: 'slash', mat: 'wood', foe: 'boar' },
    { a: -Math.PI / 2, theme: 'cliff', cls: 'hunter', pose: 'idle', mat: 'stone', foe: 'ram' },
    { a: 0, theme: 'mine', cls: 'bomber', pose: 'throw', mat: 'crystal', foe: 'beetle' },
    { a: Math.PI / 2, theme: 'salt', cls: 'sword', pose: 'run', mat: 'core', foe: 'shield' }
  ];
  PLOTS.forEach(function (pl, k) {
    var p = ringPt(pl.a), ex = HX + Math.cos(pl.a) * 90, ey = HB - 70 + Math.sin(pl.a) * 40;
    ctx.save(); ctx.setLineDash([6, 12]); ctx.lineCap = 'round'; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(242,190,70,0.75)';
    ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.quadraticCurveTo((p[0] + ex) / 2, (p[1] + ey) / 2 - 30, ex, ey); ctx.stroke(); ctx.restore();
  });
  B.glow(HX, HB - 70, 210, '255,220,110', 0.55);
  var HEAP = [];
  for (i = 0; i < 5; i++) for (j = 0; j <= 5 - i; j++) HEAP.push([(j - (5 - i) / 2) * 44, -i * 34]);
  HEAP.forEach(function (h, k) { B.mat(B.KINDS[(k * 3 + 1) % 4], HX + h[0], HB + h[1] - 12, 46); });
  // 營地兩側: 鐵砧小屋(升級所)與紅白棚小攤(商店) — 只用造型示意, 不放字
  function hut(x, y) {
    ctx.save(); ctx.lineJoin = 'round'; ctx.lineWidth = 3; ctx.strokeStyle = '#4a3020';
    ctx.fillStyle = '#e9d6b4'; ctx.fillRect(x - 38, y - 40, 76, 52); ctx.strokeRect(x - 38, y - 40, 76, 52);
    ctx.beginPath(); ctx.moveTo(x - 48, y - 38); ctx.lineTo(x, y - 76); ctx.lineTo(x + 48, y - 38); ctx.closePath(); ctx.fillStyle = '#c8603e'; ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#7a5a40'; ctx.fillRect(x - 11, y - 20, 22, 32);
    ctx.fillStyle = '#6a7080'; ctx.fillRect(x + 22, y - 72, 10, 22); ctx.strokeRect(x + 22, y - 72, 10, 22);
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; [[30, -84, 7], [36, -98, 9], [30, -114, 10]].forEach(function (s) { ctx.beginPath(); ctx.arc(x + s[0], y + s[1], s[2], 0, TAU); ctx.fill(); });
    ctx.restore();
  }
  function stall(x, y) {
    ctx.save(); ctx.lineJoin = 'round'; ctx.lineWidth = 3; ctx.strokeStyle = '#4a3020';
    ctx.fillStyle = '#7a4e26'; ctx.fillRect(x - 32, y - 40, 6, 52); ctx.fillRect(x + 26, y - 40, 6, 52);
    ctx.fillStyle = '#b07840'; ctx.fillRect(x - 40, y - 6, 80, 18); ctx.strokeRect(x - 40, y - 6, 80, 18);
    for (var s = 0; s < 5; s++) {
      var ax = x - 46 + s * 18.4;
      ctx.beginPath(); ctx.moveTo(ax, y - 56); ctx.lineTo(ax + 18.4, y - 56); ctx.lineTo(ax + 18.4, y - 42); ctx.arc(ax + 9.2, y - 42, 9.2, 0, Math.PI); ctx.closePath();
      ctx.fillStyle = s % 2 ? '#fff4dc' : '#e0503e'; ctx.fill(); ctx.lineWidth = 2; ctx.stroke();
    }
    A.icons.item(ctx, 'gear', x - 14, y - 18, 20); A.icons.item(ctx, 'heart', x + 14, y - 18, 20);
    ctx.restore();
  }
  hut(HX - 170, 470); stall(HX + 172, 470);

  // ---- 四塊關卡地景(圓角方框 + 重演中的小場景) ----
  var PW = 236, PH = 150;
  function plot(pl, k) {
    var p = ringPt(pl.a), x = p[0], y = p[1];
    ctx.save(); ctx.translate(x, y);
    // 陰影 + 外框
    ctx.fillStyle = 'rgba(40,80,60,0.25)'; roundRect(-PW / 2 + 6, -PH / 2 + 8, PW, PH, 18); ctx.fill();
    roundRect(-PW / 2 - 7, -PH / 2 - 7, PW + 14, PH + 14, 22); ctx.fillStyle = '#fff8e6'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#a07c4c'; ctx.stroke();
    ctx.save(); roundRect(-PW / 2, -PH / 2, PW, PH, 16); ctx.clip();
    B.at(0, 0, 0.36, function () { ctx.translate(-640, -440); A.drawBackground(ctx, { theme: pl.theme, t: 3 + k }); });
    if (pl.theme === 'mine') { ctx.fillStyle = 'rgba(255,214,150,0.55)'; ctx.fillRect(-PW, -PH, PW * 2, PH * 2); B.glow(0, -10, 140, '255,210,140', 0.5); }
    if (pl.theme === 'salt') { ctx.fillStyle = 'rgba(255,210,220,0.25)'; ctx.fillRect(-PW, -PH, PW * 2, PH * 2); }
    var GT = 38; B.ground(pl.theme, -PW, PW, GT, 1.1, 2);
    var HK = 1.8;
    B.hero(-40, GT, HK, pl.cls, pl.pose, { poseT: pl.pose === 'slash' ? 0.05 : 0.15 });
    B.at(52, GT - 16 * 1.6, 1.6, function () {
      var s = { x: 0, y: 0, facing: -1, flingDir: 0, hit: false, brood: false, t: 0.2 };
      if (pl.foe === 'boar') { s.state = 'stun'; A.drawBoar(ctx, s); }
      else if (pl.foe === 'ram') { s.state = 'walk'; ctx.translate(0, -2); A.drawRam(ctx, s); }
      else if (pl.foe === 'beetle') { s.state = 'crawl'; ctx.translate(0, 4); A.drawBeetle(ctx, s); }
      else { s.state = 'walk'; s.hasShield = true; ctx.translate(0, -4); A.drawShieldman(ctx, s); }
    });
    B.mat(pl.mat, 8, -40, 30, 0.6);
    ctx.restore();
    roundRect(-PW / 2, -PH / 2, PW, PH, 16); ctx.lineWidth = 5; ctx.strokeStyle = A.themes[pl.theme].cap === '#fbf3ec' ? '#e8a8d8' : (pl.theme === 'cliff' ? '#9fc0e0' : A.themes[pl.theme].cap); ctx.stroke();
    // 重演標記: 右上角循環箭頭圓章
    ctx.translate(PW / 2 - 4, -PH / 2 + 4);
    ctx.beginPath(); ctx.arc(0, 0, 19, 0, TAU); ctx.fillStyle = '#aaefd5'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#2f7a62'; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 10, -0.4, Math.PI * 1.55); ctx.lineWidth = 3.5; ctx.strokeStyle = '#2f7a62'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(9, -10); ctx.lineTo(13, -1); ctx.lineTo(3, -3); ctx.closePath(); ctx.fillStyle = '#2f7a62'; ctx.fill();
    ctx.restore();
  }
  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  // ---- 環路上不停繞圈的小隊(殘影) + 沿路掉落的素材 ----
  var RUN = [[-2.45, 'bomber'], [-2.25, 'hunter'], [-2.05, 'sword'], [-0.95, 'sword'], [0.62, 'hunter'], [0.85, 'bomber'], [2.3, 'sword'], [2.52, 'hunter']];
  RUN.forEach(function (r, k) {
    var p = ringPt(r[0]), dirx = -Math.sin(r[0]) * RX;
    B.mat(B.KINDS[k % 4], p[0] - (dirx > 0 ? 26 : -26), p[1] - 22, 18);
    B.hero(p[0], p[1] + 14, 1.35, r[1], 'run', { facing: dirx >= 0 ? 1 : -1, poseT: 0.1 * k, alpha: 0.95 });
  });
  PLOTS.forEach(plot);
})();
</script>
</body>
</html>
