<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>icon-c 守門巨像</title>
<style>body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="512" height="512"></canvas>
<script src="../game/art/art.js"></script>
<script>
// 圖示 C: 鹽原斷門的守門巨像正面特寫, 紅色獨眼怒視, 雙拳舉在兩側
(function () {
  var cv = document.getElementById('c'), ctx = cv.getContext('2d'), A = window.Art;
  var S = 512, TAU = Math.PI * 2, i;
  // 背景: 鹽原黃昏(深紫 → 粉 → 杏)+ 眼後的紅暈
  var g = ctx.createLinearGradient(0, 0, 0, S);
  g.addColorStop(0, '#2a1f4e'); g.addColorStop(0.45, '#5e4180'); g.addColorStop(0.8, '#c47d9c'); g.addColorStop(1, '#f4c2a2');
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
  var rg = ctx.createRadialGradient(256, 250, 30, 256, 250, 250);
  rg.addColorStop(0, 'rgba(255,90,60,0.45)'); rg.addColorStop(1, 'rgba(255,90,60,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, S, S);
  // 遠方斷柱剪影與鹽殼地平線(只在下緣)
  ctx.fillStyle = '#4e3a68';
  ctx.fillRect(20, 300, 56, 212); ctx.fillRect(436, 330, 56, 182);
  ctx.fillStyle = '#fbf3ec'; ctx.fillRect(0, 470, S, 42);
  ctx.fillStyle = '#e3c4d2'; ctx.fillRect(0, 466, S, 6);
  // 巨像: 第 1 階段(肩甲在)、怒眼, 縮放 1.12 置中
  ctx.save(); ctx.translate(256, 262); ctx.scale(1.12, 1.12);
  A.drawColossus(ctx, {
    hx: 0, hy: -20, phase: 1, eye: 0, lid: 0, split: 0, weak: null, angry: true,
    lf: { x: -118, y: 116, rot: 0.1 }, rf: { x: 118, y: 116, rot: -0.1 },
    plFall: 0, roar: 0, steam: 0, hit: false, ko: false, t: 0.3
  });
  ctx.restore();
})();
</script>
</body>
</html>
